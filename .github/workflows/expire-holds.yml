name: expire-holds

# Vercel Hobby chỉ cho cron 1 lần/ngày nên job hết hạn giữ chỗ (cần 5 phút/lần)
# chạy bằng GitHub Actions, gọi route cron kèm CRON_SECRET.
#
# Secrets cần đặt trong Settings → Secrets and variables → Actions:
#   SITE_URL      https://<domain production>   (không có dấu / ở cuối)
#   CRON_SECRET   trùng biến CRON_SECRET trên Vercel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expire-holds
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/jobs/expire-holds
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Thiếu secret SITE_URL hoặc CRON_SECRET" >&2
            exit 1
          fi
          curl -fsS --max-time 60 --retry 2 --retry-delay 10 \
            "${SITE_URL%/}/api/jobs/expire-holds" \
            -H "Authorization: Bearer ${CRON_SECRET}"
